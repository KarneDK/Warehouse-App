<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Warehouse Dashboard</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1e3a8a, #0f172a);
  color: #fff;
}

header {
  padding: 20px;
  font-size: 26px;
  font-weight: bold;
  text-align: center;
}

.container {
  padding: 20px;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 25px;
}

.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 15px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.card h3 {
  margin: 0;
  font-size: 16px;
  color: #cbd5f5;
}

.card p {
  font-size: 28px;
  margin-top: 10px;
  font-weight: bold;
}

.form {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 25px;
}

input {
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  width: 180px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #1d4ed8;
}

.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow: hidden;
}

th {
  background: rgba(255,255,255,0.2);
}

th, td {
  padding: 12px;
  text-align: center;
}

tr:hover {
  background: rgba(255,255,255,0.1);
}

.low-stock {
  color: #ff6b6b;
  font-weight: bold;
}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center}
.modal-content{background:white;color:black;padding:20px;border-radius:10px;max-height:80%;overflow:auto;width:80%}
.close-btn{float:right;cursor:pointer;font-weight:bold}

</style>
</head>

<body>

<header>🚀 Premium Warehouse Dashboard</header>

<div class="container">

<div class="top-bar">
  <div></div>
  <button onclick="previewTop()">Preview</button>
</div>

<div id="previewModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closePreview()">X</span>
    <h2>Fabric Details</h2>
    <div id="previewContent"></div>
  </div>
</div>

<div class="dashboard">
  <div class="card"><h3>Total Items</h3><p id="totalItems">0</p></div>
  <div class="card"><h3>Total Rolls</h3><p id="totalQty">0</p></div>
  <div class="card"><h3>Total KG</h3><p id="totalKg">0</p></div>
</div>

<div class="form">
  <input type="text" id="searchInput" placeholder="Search Item / Color" onkeyup="searchItems()">
  <input type="text" id="itemName" placeholder="Item Name">
  <input type="text" id="itemColor" placeholder="Color">
  <input type="number" id="itemRolls" placeholder="Rolls">
  <input type="number" id="itemKg" placeholder="KG">
  <button onclick="addItem()">Add / Update</button>
</div>

<div class="table-container">
<table>
<thead>
<tr>
  <th>Item</th>
  <th>Color</th>
  <th>Rolls</th>
  <th>KG</th>
  <th>Status</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
let items = JSON.parse(localStorage.getItem('warehouseData')) || [];
let editIndex = -1;
const LOW_STOCK = 5;

function saveData(){
  localStorage.setItem('warehouseData', JSON.stringify(items));
}

function addItem(){
  const name = document.getElementById('itemName').value;
  const color = document.getElementById('itemColor').value;
  const rolls = parseInt(document.getElementById('itemRolls').value);
  const kg = parseFloat(document.getElementById('itemKg').value);

  if (!name || !color || isNaN(rolls) || isNaN(kg)) {
    return alert('Enter valid details');
  }

  if(editIndex === -1){
    items.push({name,color,rolls,kg});
  } else {
    items[editIndex] = {name,color,rolls,kg};
    editIndex = -1;
  }

  saveData();
  document.getElementById('itemName').value='';
  document.getElementById('itemColor').value='';
  document.getElementById('itemRolls').value='';
  document.getElementById('itemKg').value='';

  render();
}

function editItem(index){
  const item = items[index];
  document.getElementById('itemName').value=item.name;
  document.getElementById('itemColor').value=item.color;
  document.getElementById('itemRolls').value=item.rolls;
  document.getElementById('itemKg').value=item.kg;
  editIndex=index;
}

function previewItem(index){
  const item = items[index];
  alert(`Fabric Details:

Name: ${item.name}
Color: ${item.color}
Rolls: ${item.rolls}
KG: ${item.kg}`);
}

function previewTop() {
  const modal = document.getElementById('previewModal');
  const content = document.getElementById('previewContent');

  if (items.length === 0) {
    content.innerHTML = "<p>No data available</p>";
  } else {
    let html = `
      <table style="width:100%; border-collapse:collapse;">
        <tr>
          <th>Name</th>
        </tr>
    `;

    items.forEach(item => {
      html += `
        <tr>
          <td>${item.name}</td>
        </tr>
      `;
    });

    html += `</table>`;
    content.innerHTML = html;
  }

  modal.style.display = "flex";

  html += `
      </table>
    </body>
    </html>
  `;

  newWindow.document.write(html);
  newWindow.document.close();
}

function previewNames(){
  if(items.length === 0){
    alert('No data available');
    return;
  }

  let newWindow = window.open('', '_blank');

  let html = `
    <html>
    <head>
      <title>Item Names</title>
      <style>
        body{font-family:Arial;padding:20px}
        h2{text-align:center}
        ul{font-size:18px}
      </style>
    </head>
    <body>
      <h2>Fabric Item Names</h2>
      <ul>
  `;

  items.forEach((item, index) => {
    html += `<li>${index + 1}. ${item.name}</li>`;
  });

  html += `
      </ul>
    </body>
    </html>
  `;

  newWindow.document.write(html);
  newWindow.document.close();
}

function closePreview(){
  document.getElementById('previewModal').style.display = 'none';
}

function deleteItem(index){
  items.splice(index,1);
  saveData();
  render();
}

function searchItems(){
  const query = document.getElementById('searchInput').value.toLowerCase();
  render(query);
}

function render(searchQuery=''){ 
  const tbody=document.getElementById('tableBody');
  tbody.innerHTML='';

  let totalQty=0;
  let totalKg=0;

  items.filter(item => 
    item.name.toLowerCase().includes(searchQuery) ||
    item.color.toLowerCase().includes(searchQuery)
  ).forEach((item,index)=>{
    totalQty+=item.rolls;
    totalKg+=item.kg;

    let status='OK';
    let className='';

    if(item.rolls<=LOW_STOCK){
      status='Low Stock';
      className='low-stock';
    }

tbody.innerHTML += `
<tr>
  <td>${item.name}</td>
  <td>${item.color}</td>
  <td>${item.rolls}</td>
  <td>${item.kg}</td>
  <td class="${className}">${status}</td>
  <td>
    
    <button onclick="editItem(${index})">Edit</button>
    <button onclick="deleteItem(${index})">Delete</button>
  </td>
</tr>
`;
  });

  document.getElementById('totalItems').innerText=items.length;
  document.getElementById('totalQty').innerText=totalQty;
  document.getElementById('totalKg').innerText=totalKg.toFixed(2);
}

render();
</script>

</body>
</html>
