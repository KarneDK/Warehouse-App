<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1e3a8a, #0f172a);
  color: #fff;
}

header {
  padding: 20px;
  font-size: 26px;
  text-align: center;
}

.container { padding: 20px; }

.top-bar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

.form {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 20px;
}

input {
  padding: 10px;
  border-radius: 8px;
  border: none;
}

table {
  width: 100%;
  background: rgba(255,255,255,0.1);
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  text-align: center;
}

.low-stock { color: red; }
</style>
</head>

<body>

<header> Warehouse Dashboard</header>

<div class="container">

<div class="top-bar">
  <button onclick="previewData()">Preview</button>
</div>

<div class="dashboard">
  <div class="card"><h3>Total Items</h3><p id="totalItems">0</p></div>
  <div class="card"><h3>Total Rolls</h3><p id="totalRolls">0</p></div>
  <div class="card"><h3>Total KG</h3><p id="totalKg">0</p></div>
</div>

<div class="form">
  <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchItems()">
  <input type="text" id="itemName" placeholder="Item Name">
  <input type="text" id="itemColor" placeholder="Color">
  <input type="number" id="itemRolls" placeholder="Rolls">
  <input type="number" id="itemKg" placeholder="KG">
  <button onclick="addItem()">Add / Update</button>
</div>

<table>
<thead>
<tr>
<th>Name</th>
<th>Color</th>
<th>Rolls</th>
<th>KG</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<!-- Preview Modal -->
<div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;">
<div style="background:#fff;color:#000;padding:20px;margin:5% auto;width:80%">
<span onclick="closeModal()" style="float:right;cursor:pointer;">X</span>
<h2>Fabric Data</h2>
<div id="modalContent"></div>
</div>
</div>

<script>

// 🔑 ADD YOUR SUPABASE DETAILS HERE
const supabase = window.supabase.createClient(
  "https://abcdefghijk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlbWNmbHZ1c2RhamlxaHV0Y2t4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMzgyMTAsImV4cCI6MjA5MTgxNDIxMH0.onEdFsPm2Ad17BybrlGzgMue44P94cNQaxp4Kb3dk7k"
);

let items = [];
let editId = null;

// LOAD DATA
async function loadData() {
  const { data } = await supabase.from('items').select('*');
  items = data || [];
  render();
}

// ADD / UPDATE
async function addItem() {
  const name = itemName.value.trim();
  const color = itemColor.value.trim();
  const rolls = parseInt(itemRolls.value);
  const kg = parseFloat(itemKg.value);

  if (!name || !color || isNaN(rolls) || isNaN(kg)) {
    return alert("Enter valid details");
  }

  if (editId) {
    await supabase.from('items')
      .update({ name, color, rolls, kg })
      .eq('id', editId);
    editId = null;
  } else {
    await supabase.from('items')
      .insert([{ name, color, rolls, kg }]);
  }

  itemName.value = itemColor.value = itemRolls.value = itemKg.value = "";
  loadData();
}

// EDIT
function editItem(id) {
  const item = items.find(i => i.id === id);
  itemName.value = item.name;
  itemColor.value = item.color;
  itemRolls.value = item.rolls;
  itemKg.value = item.kg;
  editId = id;
}

// DELETE
async function deleteItem(id) {
  await supabase.from('items').delete().eq('id', id);
  loadData();
}

// SEARCH
function searchItems() {
  const query = searchInput.value.toLowerCase();
  render(query);
}

// RENDER
function render(query = '') {
  tableBody.innerHTML = '';

  let totalRolls = 0;
  let totalKg = 0;

  items.filter(i =>
    i.name.toLowerCase().includes(query) ||
    i.color.toLowerCase().includes(query)
  ).forEach(item => {

    totalRolls += item.rolls;
    totalKg += item.kg;

    const status = item.rolls <= 5 ? "Low" : "OK";

    tableBody.innerHTML += `
    <tr>
      <td>${item.name}</td>
      <td>${item.color}</td>
      <td>${item.rolls}</td>
      <td>${item.kg}</td>
      <td class="${status === 'Low' ? 'low-stock':''}">${status}</td>
      <td>
       <button onclick="editItem('${item.id}')">Edit</button>
       <button onclick="deleteItem('${item.id}')">Delete</button>
      </td>
    </tr>`;
  });

  totalItems.innerText = items.length;
  document.getElementById("totalRolls").innerText = totalRolls;
  document.getElementById("totalKg").innerText = totalKg.toFixed(2);
}

// PREVIEW POPUP
function previewData() {
  let html = "<table border='1' width='100%'><tr><th>Name</th><th>Color</th></tr>";

  items.forEach(i => {
    html += `<tr><td>${i.name}</td><td>${i.color}</td></tr>`;
  });

  html += "</table>";
  modalContent.innerHTML = html;
  modal.style.display = 'block';
}

function closeModal() {
  modal.style.display = 'none';
}

// INIT
loadData();

</script>

</body>
</html>
